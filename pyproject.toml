[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickbite_food_delivery_fleet_dispatch_analytics"
version = "1.0.0"
description = "On-Demand Food Delivery Logistics Data Warehouse: Courier dispatch ETA accuracy, dark kitchen preparation bottlenecks, batching density, and surge pricing elasticity."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
